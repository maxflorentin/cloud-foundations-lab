services:
  # ---------- fuente OLTP ----------
  postgres:
    image: postgres:16
    container_name: lake-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: billetera
    ports: ["${PORT_PG:-5432}:5432"]
    volumes:
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d billetera"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- almacenamiento de objetos (S3) ----------
  minio:
    image: minio/minio:latest
    container_name: lake-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["${PORT_MINIO:-9000}:9000", "${PORT_MINIO_CONSOLE:-9001}:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
