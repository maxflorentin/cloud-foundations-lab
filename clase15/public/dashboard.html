<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Analítica en vivo</title>
  <link rel="stylesheet" href="/itba.css">
  <style>
    /* ── Layout 1920x1080 ────────────────────────────────────────────────────── */
    html, body { height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-inv); }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr 52px;
      grid-template-columns: 36% 64%;
    }

    /* Top bar */
    .topbar {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: #111c2d;
      border-bottom: 1px solid #1e2d45;
    }
    .topbar .left  { display: flex; align-items: center; gap: 12px; }
    .topbar .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5a7090; }
    .topbar .title   { font-size: 18px; font-weight: 900; color: var(--text-inv); }
    .event-counter { font-family: var(--mono); font-size: 28px; font-weight: 900; color: var(--accent); }
    .event-counter .label { font-size: 11px; color: #5a7090; display: block; text-align: right; }

    /* Log panel */
    .log-panel {
      grid-row: 2;
      display: flex; flex-direction: column;
      background: #0a1525;
      border-right: 1px solid #1e2d45;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 20px 8px;
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5a7090;
      border-bottom: 1px solid #1e2d45;
      flex-shrink: 0;
    }
    .log-list {
      flex: 1; overflow-y: auto; padding: 8px 0;
      display: flex; flex-direction: column-reverse;
    }
    .log-list::-webkit-scrollbar { width: 4px; }
    .log-list::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 2px; }
    .log-entry {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      align-items: center; gap: 10px;
      padding: 7px 20px;
      border-bottom: 1px solid #111c2d;
      font-size: 15px;
    }
    .log-entry .offset-num { font-family: var(--mono); font-size: 12px; color: #3a5070; font-weight: 700; }
    .log-entry .user       { font-weight: 700; }
    .log-entry .numero-val { font-family: var(--mono); font-size: 20px; font-weight: 900; color: var(--accent); }
    .log-entry .part       { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

    /* Metrics panel */
    .metrics-panel {
      grid-row: 2;
      display: grid;
      grid-template-rows: 1fr 1.2fr 1fr;
      overflow: hidden;
    }

    /* Row: min / max */
    .row-minmax {
      display: grid; grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #1e2d45;
    }
    .minmax-box {
      padding: 20px 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .minmax-box + .minmax-box { border-left: 1px solid #1e2d45; }
    .minmax-box .label-sm { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5a7090; margin-bottom: 8px; }
    .minmax-val {
      font-family: var(--mono); font-size: 64px; font-weight: 900; line-height: 1;
      color: var(--accent);
    }
    .minmax-user { font-size: 20px; font-weight: 700; color: var(--text-inv); margin-top: 4px; }

    /* Moda */
    .moda-box {
      padding: 16px 28px;
      border-bottom: 1px solid #1e2d45;
      display: flex; flex-direction: column; justify-content: center;
    }
    .moda-header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .moda-header .label-sm { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5a7090; }
    .idempotent-badge {
      padding: 3px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      cursor: pointer; transition: background 200ms, color 200ms;
    }
    .idempotent-badge.off { background: #1e2d45; color: #5a7090; }
    .idempotent-badge.on  { background: var(--yellow); color: var(--text); }
    .moda-top {
      display: flex; align-items: flex-end; gap: 20px;
    }
    .moda-item { text-align: center; }
    .moda-item .moda-num {
      font-family: var(--mono); font-weight: 900; color: var(--text-inv);
      transition: transform 300ms, color 300ms;
    }
    .moda-item:first-child .moda-num { font-size: 72px; color: var(--accent); }
    .moda-item:not(:first-child) .moda-num { font-size: 40px; color: #4a6080; }
    .moda-item .moda-count { font-size: 13px; color: #5a7090; margin-top: 2px; }

    /* Ventana */
    .ventana-box {
      padding: 16px 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .ventana-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
    .ventana-stat   { font-family: var(--mono); font-size: 28px; font-weight: 900; color: var(--text-inv); }
    .ventana-stat span { font-size: 14px; color: #5a7090; margin-left: 6px; font-family: var(--sans); }
    .sparkline { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
    .spark-bar {
      flex: 1; border-radius: 3px 3px 0 0;
      background: #2a3d55;
      min-width: 12px;
      transition: height 400ms ease-out;
      position: relative;
    }
    .spark-bar.active { background: var(--accent); opacity: .7; }
    .spark-bar .spark-tip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 10px; color: #5a7090; white-space: nowrap; }

    /* Bottom bar */
    .bottombar {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: #0a1525;
      border-top: 1px solid #1e2d45;
      font-size: 13px;
    }
    .lag-indicators { display: flex; gap: 24px; align-items: center; }
    .lag-item { display: flex; align-items: center; gap: 8px; }
    .lag-name { font-weight: 700; }
    .lag-num  { font-family: var(--mono); min-width: 32px; }
    .admin-btns { display: flex; gap: 10px; }
    .admin-btns .btn { min-height: 32px; padding: 4px 14px; font-size: 12px; }
    .kbd { display: inline-block; font-family: var(--mono); font-size: 10px; background: #1e2d45; border-radius: 3px; padding: 1px 5px; margin-left: 4px; color: #8a9ab0; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Top bar -->
  <header class="topbar">
    <div class="left">
      <div>
        <div class="eyebrow">ITBA / Cloud Architecture</div>
        <div class="title">Analítica de eventos en tiempo real</div>
      </div>
    </div>
    <div>
      <span class="event-counter" id="evCount">0</span>
      <span class="label" style="font-size:11px;color:#5a7090;display:block;text-align:right">eventos en el log</span>
    </div>
  </header>

  <!-- Log panel -->
  <section class="log-panel" id="logPanel">
    <div class="panel-header">El log — append-only, offsets</div>
    <div class="log-list" id="logList"></div>
  </section>

  <!-- Metrics panel -->
  <section class="metrics-panel">

    <!-- Min / Max -->
    <div class="row-minmax">
      <div class="minmax-box">
        <div class="label-sm">Minimo</div>
        <div class="minmax-val" id="minVal">—</div>
        <div class="minmax-user" id="minUser"></div>
      </div>
      <div class="minmax-box">
        <div class="label-sm">Maximo</div>
        <div class="minmax-val" id="maxVal">—</div>
        <div class="minmax-user" id="maxUser"></div>
      </div>
    </div>

    <!-- Moda -->
    <div class="moda-box">
      <div class="moda-header">
        <span class="label-sm">Mas elegido</span>
        <span class="idempotent-badge off" id="idempotentBadge" title="[I] toggle idempotencia">
          idempotencia OFF
        </span>
        <span style="color:#5a7090;font-size:12px"><kbd class="kbd">I</kbd></span>
      </div>
      <div class="moda-top" id="modaTop">
        <div class="moda-item"><div class="moda-num" id="moda1">—</div><div class="moda-count" id="modaC1"></div></div>
        <div class="moda-item"><div class="moda-num" id="moda2">—</div><div class="moda-count" id="modaC2"></div></div>
        <div class="moda-item"><div class="moda-num" id="moda3">—</div><div class="moda-count" id="modaC3"></div></div>
      </div>
    </div>

    <!-- Ventana tumbling -->
    <div class="ventana-box">
      <div class="ventana-header">
        <span class="label-sm">Ventana 10s</span>
        <span class="ventana-stat" id="vCount">0 <span>eventos</span></span>
        <span class="ventana-stat" id="vAvg" style="color:#5a7090">— <span>avg</span></span>
      </div>
      <div class="sparkline" id="sparkline"></div>
    </div>

  </section>

  <!-- Bottom bar -->
  <footer class="bottombar">
    <div class="lag-indicators" id="lagRow">
      <div class="lag-item">
        <span class="lag-dot" id="dot-minimo"></span>
        <span class="lag-name">minimo</span>
        <span class="lag-num" id="lag-minimo">0</span>
      </div>
      <div class="lag-item">
        <span class="lag-dot" id="dot-maximo"></span>
        <span class="lag-name">maximo</span>
        <span class="lag-num" id="lag-maximo">0</span>
      </div>
      <div class="lag-item">
        <span class="lag-dot" id="dot-moda"></span>
        <span class="lag-name">moda</span>
        <span class="lag-num" id="lag-moda">0</span>
      </div>
      <div class="lag-item">
        <span class="lag-dot" id="dot-ventana"></span>
        <span class="lag-name">ventana</span>
        <span class="lag-num" id="lag-ventana">0</span>
      </div>
      <div class="lag-item">
        <span class="lag-dot" id="dot-lento" class="critical"></span>
        <span class="lag-name" style="color:var(--magenta)">lento</span>
        <span class="lag-num" id="lag-lento">0</span>
      </div>
    </div>
    <div class="admin-btns">
      <button class="btn btn-sm btn-secondary" onclick="adminReplay()" title="Replay [R]">
        Replay <kbd class="kbd">R</kbd>
      </button>
      <button class="btn btn-sm btn-secondary" id="btnIdempotent" onclick="adminToggleIdempotent()" title="Idempotencia [I]">
        Idempotencia <kbd class="kbd">I</kbd>
      </button>
      <button class="btn btn-sm btn-secondary" onclick="toggleLog()" title="Log [L]">
        Log <kbd class="kbd">L</kbd>
      </button>
      <button class="btn btn-sm btn-danger" onclick="adminReset()" title="Reset [X]">
        Reset <kbd class="kbd">X</kbd>
      </button>
    </div>
  </footer>

</div>

<script>
  // ── Estado ──────────────────────────────────────────────────────────────────
  let idempotentState = false;
  let knownOffsets = new Set();
  let prevModaTop   = null;

  // ── SSE ─────────────────────────────────────────────────────────────────────
  function connect() {
    const es = new EventSource('/stream');
    es.onmessage = (e) => update(JSON.parse(e.data));
    es.onerror   = () => setTimeout(connect, 2000);
  }
  connect();

  // ── Update ───────────────────────────────────────────────────────────────────
  function update(d) {
    updateCounter(d.logLength);
    updateLog(d.ultimos || []);
    updateMinMax(d.consumers);
    updateModa(d.consumers.moda);
    updateVentana(d.consumers.ventana);
    updateLag(d.consumers);
  }

  // Contador top-bar
  function updateCounter(n) {
    document.getElementById('evCount').textContent = n;
  }

  // Log list — añade sólo entradas nuevas con animación
  function updateLog(items) {
    const list = document.getElementById('logList');
    items.forEach(item => {
      if (knownOffsets.has(item.offset)) return;
      knownOffsets.add(item.offset);

      const el = document.createElement('div');
      el.className = 'log-entry event-new';
      const partClass = 'p' + (item.partition ?? 0);
      el.innerHTML = `
        <span class="offset-num mono">${item.offset}</span>
        <span class="user">${esc(item.user)}</span>
        <span class="numero-val">${item.numero}</span>
        <span class="part ${partClass}">${item.partition}</span>
      `;
      // column-reverse: insertar al principio = aparece arriba visualmente
      list.prepend(el);
      // mantener máximo 30 nodos en el DOM
      while (list.children.length > 30) list.removeChild(list.lastChild);
    });
  }

  // Min / Max
  function updateMinMax(c) {
    setText('minVal',  c.minimo.numero ?? '—');
    setText('minUser', c.minimo.user   ?? '');
    setText('maxVal',  c.maximo.numero ?? '—');
    setText('maxUser', c.maximo.user   ?? '');
  }

  // Moda — detecta cambio de número #1 y hace flash
  function updateModa(m) {
    idempotentState = m.idempotent;
    const badge = document.getElementById('idempotentBadge');
    badge.className = 'idempotent-badge ' + (m.idempotent ? 'on' : 'off');
    badge.textContent = 'idempotencia ' + (m.idempotent ? 'ON' : 'OFF');

    const top = m.top || [];
    const newTop1 = top[0]?.numero;
    const changed = prevModaTop !== null && prevModaTop !== newTop1;
    prevModaTop = newTop1;

    const ids = ['moda1','moda2','moda3'];
    const cids = ['modaC1','modaC2','modaC3'];
    ids.forEach((id, i) => {
      const el = document.getElementById(id);
      const v  = top[i]?.numero ?? '—';
      el.textContent = v;
      if (i === 0 && changed) {
        el.classList.remove('flash');
        void el.offsetWidth; // reflow to restart animation
        el.classList.add('flash');
      }
    });
    cids.forEach((id, i) => {
      setText(id, top[i] ? `x${top[i].count}` : '');
    });
  }

  // Ventana
  function updateVentana(v) {
    if (!v.actual) {
      setText('vCount', '0'); setText('vAvg', '—');
      return;
    }
    document.getElementById('vCount').innerHTML = `${v.actual.count} <span>eventos</span>`;
    document.getElementById('vAvg').innerHTML   = `${v.actual.avg} <span>avg</span>`;
    renderSparkline(v.actual, v.previas || []);
  }

  function renderSparkline(actual, previas) {
    const all = [...previas].reverse(); // más antiguo primero
    const maxCount = Math.max(actual.count, ...all.map(w => w.count), 1);
    const spark = document.getElementById('sparkline');
    spark.innerHTML = '';
    [...all, actual].forEach((w, i) => {
      const bar = document.createElement('div');
      const pct = Math.max(8, Math.round((w.count / maxCount) * 100));
      bar.className = 'spark-bar' + (i === all.length ? ' active' : '');
      bar.style.height = pct + '%';
      const tip = document.createElement('span');
      tip.className = 'spark-tip';
      tip.textContent = w.count;
      bar.appendChild(tip);
      spark.appendChild(bar);
    });
  }

  // Lag
  function updateLag(consumers) {
    for (const [name, data] of Object.entries(consumers)) {
      const lag = data.lag ?? 0;
      const dot = document.getElementById('dot-' + name);
      const num = document.getElementById('lag-' + name);
      if (!dot || !num) continue;
      num.textContent = lag;
      dot.className = 'lag-dot' + (lag === 0 ? '' : lag <= 20 ? ' warn' : ' critical');
    }
  }

  // ── Admin ────────────────────────────────────────────────────────────────────
  async function adminReplay() {
    await fetch('/admin/replay', { method: 'POST' });
    knownOffsets.clear();
    document.getElementById('logList').innerHTML = '';
  }

  async function adminToggleIdempotent() {
    idempotentState = !idempotentState;
    await fetch('/admin/idempotent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: idempotentState }),
    });
  }

  function toggleLog() {
    const panel = document.getElementById('logPanel');
    panel.style.display = panel.style.display === 'none' ? '' : 'none';
  }

  async function adminReset() {
    if (!confirm('Vaciar el log completo?')) return;
    await fetch('/admin/reset', { method: 'POST' });
    knownOffsets.clear();
    document.getElementById('logList').innerHTML = '';
  }

  // ── Teclado ──────────────────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'r' || e.key === 'R') adminReplay();
    if (e.key === 'i' || e.key === 'I') adminToggleIdempotent();
    if (e.key === 'l' || e.key === 'L') toggleLog();
    if (e.key === 'x' || e.key === 'X') adminReset();
  });

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function setText(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
